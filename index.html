<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Inventory Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: auto;
  padding: 15px;
  text-align: center;
  background: #f5f5f5;
}

h1 {
  font-size: 28px;
}

.box {
  background: white;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
}

#modeDisplay {
  font-size: 18px;
  font-weight: bold;
}

#location {
  font-size: 38px;
  font-weight: bold;
  margin-top: 5px;
}

#reader {
  width: 100%;
  background: white;
  margin-top: 15px;
}

#status {
  background: white;
  border-radius: 12px;
  padding: 18px;
  margin-top: 15px;
  font-size: 20px;
  min-height: 30px;
}

#lastItem {
  font-size: 22px;
  font-weight: bold;
}

#counter {
  font-size: 30px;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 10px;
  font-size: 18px;
  border: 0;
  border-radius: 10px;
}

#inventoryButton {
  background: #1677ff;
  color: white;
}

#lookupButton {
  background: #6f42c1;
  color: white;
}

#startButton {
  background: #222;
  color: white;
}

#undoButton {
  background: #ff9800;
  color: white;
  font-weight: bold;
}

#undoButton:disabled {
  background: #ccc;
  color: #777;
}

#clearButton {
  background: #ddd;
}

.success {
  background: #22c55e !important;
  color: white !important;
  font-weight: bold;
}

.error {
  background: #ef4444 !important;
  color: white !important;
  font-weight: bold;
}

.undo {
  background: #ff9800 !important;
  color: white !important;
  font-weight: bold;
}

.lookup {
  background: #6f42c1 !important;
  color: white !important;
  font-weight: bold;
}


/* PRODUCT CARD */

#productCard {
  display: none;
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-top: 15px;
  text-align: left;
}

#productName {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 15px;
}

.productRow {
  padding: 7px 0;
  font-size: 19px;
  border-bottom: 1px solid #eee;
}

#productQuantity {
  font-size: 30px;
  font-weight: bold;
}


/* HISTORY */

#historyBox {
  background: white;
  border-radius: 12px;
  padding: 15px;
  margin-top: 15px;
  text-align: left;
}

#historyList {
  margin-top: 10px;
}

.historyItem {
  padding: 8px 0;
  border-bottom: 1px solid #eee;
  font-size: 16px;
}

</style>

</head>


<body>


<h1>Inventory Scanner</h1>


<div class="box">

  MODE

  <div id="modeDisplay">
    INVENTORY / MOVE
  </div>

</div>


<button id="inventoryButton">
  📦 INVENTORY / MOVE
</button>


<button id="lookupButton">
  🔍 PRODUCT LOOKUP
</button>



<div class="box">

  Current Location

  <div id="location">
    Not selected
  </div>

</div>



<div class="box">

  Last Item

  <div id="lastItem">
    —
  </div>

</div>



<div class="box">

  Items Scanned

  <div id="counter">
    0
  </div>

</div>



<button id="startButton">
  START SCANNER
</button>


<div id="reader"></div>



<div id="status">
  Scan Location QR first
</div>



<div id="productCard">

  <div id="productName">
    —
  </div>

  <div class="productRow">
    Item #:
    <span id="productItem"></span>
  </div>

  <div class="productRow">
    Price:
    <span id="productPrice"></span>
  </div>

  <div class="productRow">
    Location:
    <span id="productLocation"></span>
  </div>

  <div class="productRow">
    Quantity:
    <span id="productQuantity"></span>
  </div>

</div>



<button
  id="undoButton"
  disabled
>
  UNDO LAST ITEM
</button>


<button id="clearButton">
  CLEAR LOCATION
</button>



<div id="historyBox">

  <strong>
    Recent Scans
  </strong>

  <div id="historyList">
    No scans yet
  </div>

</div>



<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbyZwLEiOopCUoR66P5vNt7yBE4wXeNhStdfBopXbRErUFgQwiirXuH4LBYN9OlB3CmR/exec";



let currentLocation =
localStorage.getItem("inventoryLocation") || "";


let currentMode =
"inventory";


let scanner = null;

let scannerStarted = false;

let scannedCount = 0;

let audioContext = null;


/*
  This contains everything required
  to restore BOTH Location and Quantity.
*/

let lastSuccessfulScan = null;


let scanHistory = [];


const recentScans =
new Map();


const SAME_QR_LOCK_TIME =
8000;



const modeDisplay =
document.getElementById("modeDisplay");

const locationDisplay =
document.getElementById("location");

const statusDisplay =
document.getElementById("status");

const lastItemDisplay =
document.getElementById("lastItem");

const counterDisplay =
document.getElementById("counter");

const startButton =
document.getElementById("startButton");

const inventoryButton =
document.getElementById("inventoryButton");

const lookupButton =
document.getElementById("lookupButton");

const undoButton =
document.getElementById("undoButton");

const clearButton =
document.getElementById("clearButton");

const productCard =
document.getElementById("productCard");

const productName =
document.getElementById("productName");

const productItem =
document.getElementById("productItem");

const productPrice =
document.getElementById("productPrice");

const productLocation =
document.getElementById("productLocation");

const productQuantity =
document.getElementById("productQuantity");

const historyList =
document.getElementById("historyList");



if (currentLocation) {

  locationDisplay.innerText =
  currentLocation;

  statusDisplay.innerText =
  "Ready. Scan Item QR.";

}



inventoryButton.addEventListener(
  "click",
  function() {

    currentMode =
    "inventory";

    modeDisplay.innerText =
    "INVENTORY / MOVE";

    productCard.style.display =
    "none";

    recentScans.clear();


    if (currentLocation) {

      statusDisplay.className =
      "";

      statusDisplay.innerText =
      "Ready. Scan Item QR.";

    } else {

      statusDisplay.className =
      "";

      statusDisplay.innerText =
      "Scan Location QR first";

    }

  }
);



lookupButton.addEventListener(
  "click",
  function() {

    currentMode =
    "lookup";

    modeDisplay.innerText =
    "PRODUCT LOOKUP";

    productCard.style.display =
    "none";

    recentScans.clear();

    statusDisplay.className =
    "lookup";

    statusDisplay.innerText =
    "Scan Product QR";

  }
);



startButton.addEventListener(
  "click",
  startScanner
);


undoButton.addEventListener(
  "click",
  undoLastItem
);


clearButton.addEventListener(
  "click",
  clearLocation
);



function startScanner() {


  if (scannerStarted) {

    return;

  }


  unlockAudio();


  statusDisplay.className =
  "";

  statusDisplay.innerText =
  "Starting camera...";


  scanner =
  new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    onScanSuccess,

    function() {}

  )

  .then(function() {


    scannerStarted =
    true;


    startButton.style.display =
    "none";


    if (currentMode === "lookup") {

      statusDisplay.className =
      "lookup";

      statusDisplay.innerText =
      "Scan Product QR";

    } else if (currentLocation) {

      statusDisplay.className =
      "";

      statusDisplay.innerText =
      "Ready. Scan Item QR.";

    } else {

      statusDisplay.className =
      "";

      statusDisplay.innerText =
      "Scan Location QR first";

    }

  })

  .catch(function(error) {

    statusDisplay.className =
    "error";

    statusDisplay.innerText =
    "Camera error: " + error;

  });

}



function unlockAudio() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!audioContext) {

      audioContext =
      new AudioContext();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    const osc =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    gain.gain.value =
    0.0001;


    osc.connect(gain);

    gain.connect(
      audioContext.destination
    );


    osc.start();

    osc.stop(
      audioContext.currentTime +
      0.05
    );


  } catch(e) {}

}



function onScanSuccess(decodedText) {


  const code =
  decodedText.trim();


  const now =
  Date.now();


  const previousScan =
  recentScans.get(code) || 0;


  if (

    now - previousScan <
    SAME_QR_LOCK_TIME

  ) {

    return;

  }


  recentScans.set(
    code,
    now
  );



  for (

    const [savedCode, savedTime]
    of recentScans

  ) {

    if (

      now - savedTime >
      SAME_QR_LOCK_TIME

    ) {

      recentScans.delete(
        savedCode
      );

    }

  }



  /*
    LOOKUP MODE

    Location QR does nothing here.
    Item QR only READS the Sheet.
  */

  if (currentMode === "lookup") {


    if (

      code.toUpperCase()
        .startsWith("I:")

    ) {


      const item =
      code.substring(2).trim();


      if (item) {

        lookupItem(item);

      }


      return;

    }


    showError(
      "Scan Product QR"
    );


    return;

  }



  /*
    INVENTORY MODE - LOCATION
  */

  if (

    code.toUpperCase()
      .startsWith("L:")

  ) {


    const location =
    code.substring(2).trim();


    if (!location) {

      return;

    }


    currentLocation =
    location;


    localStorage.setItem(

      "inventoryLocation",

      currentLocation

    );


    locationDisplay.innerText =
    currentLocation;


    statusDisplay.className =
    "success";


    statusDisplay.innerText =

    "✓ LOCATION " +

    currentLocation;


    playLocationTone();


    return;

  }



  /*
    INVENTORY MODE - ITEM
  */

  if (

    code.toUpperCase()
      .startsWith("I:")

  ) {


    const item =
    code.substring(2).trim();


    if (!item) {

      return;

    }


    if (!currentLocation) {

      showError(
        "Scan Location first"
      );

      return;

    }


    saveItem(item);


    return;

  }


  showError(
    "Unknown QR: " + code
  );

}



// ========================================
// SAVE INVENTORY ITEM
// ========================================

function saveItem(item) {


  statusDisplay.className =
  "";


  statusDisplay.innerText =

  "Saving Item #" +

  item +

  "...";



  jsonpRequest(

    "update",

    {
      item: item,
      location: currentLocation
    },

    function(data) {


      if (!data.success) {

        showError(
          data.message ||
          "Item not found"
        );

        return;

      }


      /*
        CRITICAL PART:

        Save BOTH old Location
        AND old Quantity for UNDO.
      */

      lastSuccessfulScan = {

        item:
          item,

        name:
          data.name || "",

        previousLocation:
          data.previousLocation || "",

        previousQuantity:
          Number(
            data.previousQuantity || 1
          ),

        newLocation:
          data.newLocation ||
          currentLocation,

        quantity:
          Number(
            data.quantity || 1
          )

      };


      undoButton.disabled =
      false;


      scannedCount++;


      counterDisplay.innerText =
      scannedCount;


      lastItemDisplay.innerText =
      "#" + item;



      showProductCard({

        item:
          item,

        name:
          data.name || "",

        price:
          data.price,

        location:
          data.newLocation ||
          currentLocation,

        quantity:
          Number(
            data.quantity || 1
          )

      });



      statusDisplay.className =
      "success";


      statusDisplay.innerHTML =

      "✓ ITEM #" +
      escapeHtml(item) +

      "<br>" +

      "LOCATION " +
      escapeHtml(
        data.newLocation ||
        currentLocation
      ) +

      "<br>" +

      "QUANTITY: " +
      Number(
        data.quantity || 1
      );



      addHistory(

        "#" + item +
        " → Location " +
        (
          data.newLocation ||
          currentLocation
        ) +
        " | Qty " +
        Number(
          data.quantity || 1
        )

      );


      playSuccessTone();

    }

  );

}



// ========================================
// PRODUCT LOOKUP - READ ONLY
// ========================================

function lookupItem(item) {


  statusDisplay.className =
  "lookup";


  statusDisplay.innerText =

  "Looking up Item #" +

  item +

  "...";



  jsonpRequest(

    "lookup",

    {
      item: item
    },

    function(data) {


      if (!data.success) {

        showError(
          data.message ||
          "Item not found"
        );

        return;

      }



      showProductCard({

        item:
          data.item,

        name:
          data.name,

        price:
          data.price,

        location:
          data.location,

        quantity:
          Number(
            data.quantity || 1
          )

      });



      lastItemDisplay.innerText =
      "#" + data.item;



      statusDisplay.className =
      "lookup";


      statusDisplay.innerHTML =

      "🔍 ITEM #" +
      escapeHtml(data.item) +

      "<br>" +

      "QUANTITY: " +
      Number(
        data.quantity || 1
      );



      addHistory(

        "LOOKUP #" +
        data.item +
        " | Location " +
        (
          data.location ||
          "—"
        ) +
        " | Qty " +
        Number(
          data.quantity || 1
        )

      );


      playLookupTone();

    }

  );

}



// ========================================
// PRODUCT CARD
// ========================================

function showProductCard(data) {


  productCard.style.display =
  "block";


  productName.innerText =
  data.name ||
  "No product name";


  productItem.innerText =
  data.item ||
  "—";


  /*
    PRICE

    If J contains a number,
    show it as dollars.
  */

  if (

    data.price !== "" &&
    data.price !== null &&
    data.price !== undefined

  ) {


    const numericPrice =
    Number(data.price);


    if (!isNaN(numericPrice)) {

      productPrice.innerText =
      "$" +
      numericPrice.toFixed(2);

    } else {

      productPrice.innerText =
      data.price;

    }


  } else {

    productPrice.innerText =
    "—";

  }


  productLocation.innerText =
  data.location ||
  "Not assigned";


  productQuantity.innerText =
  data.quantity || 1;

}



// ========================================
// UNDO
// ========================================

function undoLastItem() {


  if (!lastSuccessfulScan) {

    return;

  }


  const undoData =
  lastSuccessfulScan;


  /*
    Prevent double tap.
  */

  undoButton.disabled =
  true;


  statusDisplay.className =
  "";


  statusDisplay.innerText =

  "Undoing Item #" +

  undoData.item +

  "...";



  jsonpRequest(

    "undo",

    {

      item:
        undoData.item,

      previousLocation:
        undoData.previousLocation,

      /*
        THIS WAS MISSING BEFORE.

        Server now receives the exact
        quantity from before the scan.
      */

      previousQuantity:
        undoData.previousQuantity

    },

    function(data) {


      if (!data.success) {


        showError(
          data.message ||
          "Undo failed"
        );


        undoButton.disabled =
        false;


        return;

      }



      if (scannedCount > 0) {

        scannedCount--;

      }


      counterDisplay.innerText =
      scannedCount;



      statusDisplay.className =
      "undo";


      statusDisplay.innerHTML =

      "↶ ITEM #" +
      escapeHtml(
        undoData.item
      ) +

      "<br>" +

      "LOCATION: " +
      escapeHtml(
        undoData.previousLocation ||
        "BLANK"
      ) +

      "<br>" +

      "QUANTITY: " +
      Number(
        undoData.previousQuantity
      );



      /*
        Show restored values
        in product card.
      */

      showProductCard({

        item:
          undoData.item,

        name:
          undoData.name,

        price:
          "",

        location:
          undoData.previousLocation,

        quantity:
          undoData.previousQuantity

      });



      addHistory(

        "UNDO #" +
        undoData.item +
        " → Location " +
        (
          undoData.previousLocation ||
          "blank"
        ) +
        " | Qty " +
        undoData.previousQuantity

      );



      /*
        Allow this QR to be scanned
        again immediately after UNDO.
      */

      recentScans.delete(
        "I:" +
        undoData.item
      );


      lastSuccessfulScan =
      null;


      lastItemDisplay.innerText =
      "—";


      playUndoTone();

    }

  );

}



// ========================================
// JSONP REQUEST
// ========================================

function jsonpRequest(
  action,
  parameters,
  callback
) {


  const callbackName =

  "inventoryCallback_" +

  Date.now() +

  "_" +

  Math.floor(
    Math.random() * 100000
  );


  const script =
  document.createElement(
    "script"
  );


  let finished =
  false;



  window[callbackName] =
  function(data) {


    if (finished) {

      return;

    }


    finished =
    true;


    cleanup();


    callback(data);

  };



  let url =

  API_URL +

  "?action=" +

  encodeURIComponent(action);



  for (

    const key in parameters

  ) {


    url +=

    "&" +

    encodeURIComponent(key) +

    "=" +

    encodeURIComponent(
      parameters[key]
    );

  }



  url +=

  "&callback=" +

  encodeURIComponent(
    callbackName
  ) +

  "&t=" +

  Date.now();



  script.onerror =
  function() {


    if (finished) {

      return;

    }


    finished =
    true;


    cleanup();


    showError(
      "Could not reach server"
    );

  };



  script.src =
  url;


  document.body.appendChild(
    script
  );



  setTimeout(
    function() {


      if (finished) {

        return;

      }


      finished =
      true;


      cleanup();


      showError(
        "Server timeout"
      );


    },
    10000
  );



  function cleanup() {


    if (script.parentNode) {

      script.parentNode
        .removeChild(script);

    }


    try {

      delete window[
        callbackName
      ];

    } catch(e) {}

  }

}



// ========================================
// HISTORY
// ========================================

function addHistory(text) {


  scanHistory.unshift(text);


  if (
    scanHistory.length > 10
  ) {

    scanHistory =
    scanHistory.slice(
      0,
      10
    );

  }


  renderHistory();

}



function renderHistory() {


  historyList.innerHTML =
  "";


  if (
    scanHistory.length === 0
  ) {

    historyList.innerText =
    "No scans yet";

    return;

  }


  scanHistory.forEach(
    function(text) {


      const div =
      document.createElement(
        "div"
      );


      div.className =
      "historyItem";


      div.innerText =
      text;


      historyList.appendChild(
        div
      );

    }
  );

}



// ========================================
// CLEAR LOCATION
// ========================================

function clearLocation() {


  currentLocation =
  "";


  localStorage.removeItem(
    "inventoryLocation"
  );


  locationDisplay.innerText =
  "Not selected";


  statusDisplay.className =
  "";


  statusDisplay.innerText =
  "Scan Location QR first";


  recentScans.clear();


  lastSuccessfulScan =
  null;


  undoButton.disabled =
  true;

}



// ========================================
// ERROR
// ========================================

function showError(message) {


  statusDisplay.className =
  "error";


  statusDisplay.innerText =

  "ERROR: " +

  message;


  playErrorTone();

}



// ========================================
// AUDIO
// ========================================

function playTone(
  frequency,
  duration,
  volume
) {


  try {


    if (!audioContext) {

      return;

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    const oscillator =
    audioContext.createOscillator();


    const gain =
    audioContext.createGain();


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.type =
    "sine";


    oscillator.frequency.value =
    frequency;


    gain.gain.setValueAtTime(

      volume || 0.35,

      audioContext.currentTime

    );


    gain.gain
      .exponentialRampToValueAtTime(

        0.01,

        audioContext.currentTime +
        duration / 1000

      );


    oscillator.start();


    oscillator.stop(

      audioContext.currentTime +
      duration / 1000

    );


  } catch(e) {}

}



function playLocationTone() {

  playTone(
    650,
    120,
    0.25
  );

}



function playSuccessTone() {


  playTone(
    850,
    120,
    0.35
  );


  setTimeout(
    function() {

      playTone(
        1150,
        160,
        0.35
      );

    },
    130
  );

}



function playErrorTone() {

  playTone(
    220,
    450,
    0.4
  );

}



function playUndoTone() {


  playTone(
    700,
    120,
    0.3
  );


  setTimeout(
    function() {

      playTone(
        500,
        180,
        0.3
      );

    },
    130
  );

}



function playLookupTone() {

  playTone(
    750,
    100,
    0.25
  );

}



// ========================================
// SAFETY FOR HTML DISPLAY
// ========================================

function escapeHtml(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


</script>

</body>

</html>
