<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inventory Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 15px;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      font-size: 28px;
    }

    .box {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    #location {
      font-size: 32px;
      font-weight: bold;
      margin-top: 5px;
    }

    #reader {
      width: 100%;
      background: white;
      margin-top: 15px;
    }

    #status {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-top: 15px;
      font-size: 20px;
      min-height: 30px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      font-size: 18px;
      border: 0;
      border-radius: 10px;
    }

    #startButton {
      background: #1677ff;
      color: white;
    }

    #clearButton {
      background: #ddd;
    }
  </style>
</head>

<body>

<h1>Inventory Scanner</h1>

<div class="box">
  Current Location
  <div id="location">Not selected</div>
</div>

<button id="startButton">
  START SCANNER
</button>

<div id="reader"></div>

<div id="status">
  Scan Location QR first
</div>

<button id="clearButton">
  CLEAR LOCATION
</button>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbyZwLEiOopCUoR66P5vNt7yBE4wXeNhStdfBopXbRErUFgQwiirXuH4LBYN9OlB3CmR/exec";


let currentLocation =
  localStorage.getItem("inventoryLocation") || "";

let scanner = null;

let lastCode = "";
let lastScanTime = 0;


const locationDisplay =
  document.getElementById("location");

const statusDisplay =
  document.getElementById("status");

const startButton =
  document.getElementById("startButton");

const clearButton =
  document.getElementById("clearButton");


if (currentLocation) {

  locationDisplay.innerText =
    currentLocation;

  statusDisplay.innerText =
    "Ready. Scan Item QR.";
}


startButton.addEventListener(
  "click",
  startScanner
);


clearButton.addEventListener(
  "click",
  clearLocation
);


function startScanner() {

  statusDisplay.innerText =
    "Starting camera...";

  scanner =
    new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    onScanSuccess,

    function () {
      // Ignore normal scanning errors
    }

  )

  .then(function () {

    startButton.style.display =
      "none";

    if (currentLocation) {

      statusDisplay.innerText =
        "Ready. Scan Item QR.";

    } else {

      statusDisplay.innerText =
        "Scan Location QR first";
    }

  })

  .catch(function (error) {

    statusDisplay.innerText =
      "Camera error: " + error;
  });
}



function onScanSuccess(decodedText) {

  const now =
    Date.now();

  const code =
    decodedText.trim();


  if (
    code === lastCode &&
    now - lastScanTime < 2500
  ) {
    return;
  }


  lastCode =
    code;

  lastScanTime =
    now;


  // LOCATION
  // Example: L:1

  if (
    code.toUpperCase().startsWith("L:")
  ) {

    const location =
      code.substring(2).trim();


    if (!location) {
      return;
    }


    currentLocation =
      location;


    localStorage.setItem(
      "inventoryLocation",
      currentLocation
    );


    locationDisplay.innerText =
      currentLocation;


    statusDisplay.innerText =
      "✓ Location " +
      currentLocation +
      " selected";


    vibrate();

    return;
  }



  // ITEM
  // Example: I:5067

  if (
    code.toUpperCase().startsWith("I:")
  ) {

    const item =
      code.substring(2).trim();


    if (!item) {
      return;
    }


    if (!currentLocation) {

      statusDisplay.innerText =
        "ERROR: Scan Location first";

      return;
    }


    saveItem(item);

    return;
  }


  statusDisplay.innerText =
    "Unknown QR: " + code;
}



function saveItem(item) {

  statusDisplay.innerText =
    "Saving Item #" + item + "...";

  const callbackName =
    "inventoryCallback_" + Date.now();

  const script =
    document.createElement("script");

  const url =
    API_URL +
    "?action=update" +
    "&item=" + encodeURIComponent(item) +
    "&location=" + encodeURIComponent(currentLocation) +
    "&callback=" + encodeURIComponent(callbackName);


  let finished = false;


  window[callbackName] = function(data) {

    finished = true;

    if (data.success) {

      statusDisplay.innerText =
        "✓ Item #" +
        item +
        " → Location " +
        currentLocation;

      vibrate();

    } else {

      statusDisplay.innerText =
        "ERROR: " + data.message;
    }


    cleanup();
  };


  script.onerror = function() {

    if (!finished) {

      statusDisplay.innerText =
        "ERROR: Could not reach server";
    }

    cleanup();
  };


  script.src = url;

  document.body.appendChild(script);


  setTimeout(function() {

    if (!finished) {

      statusDisplay.innerText =
        "ERROR: Server timeout";

      cleanup();
    }

  }, 10000);


  function cleanup() {

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    try {
      delete window[callbackName];
    } catch (e) {}
  }
}
  .then(function () {

    statusDisplay.innerText =
      "✓ Item #" +
      item +
      " → Location " +
      currentLocation;


    vibrate();

  })

  .catch(function (error) {

    statusDisplay.innerText =
      "Connection error: " +
      error;

  });
}



function clearLocation() {

  currentLocation =
    "";


  localStorage.removeItem(
    "inventoryLocation"
  );


  locationDisplay.innerText =
    "Not selected";


  statusDisplay.innerText =
    "Scan Location QR first";
}



function vibrate() {

  if (navigator.vibrate) {

    navigator.vibrate(100);

  }
}

</script>

</body>
</html>
