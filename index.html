<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Inventory Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 15px;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      font-size: 28px;
    }

    .box {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    #location {
      font-size: 32px;
      font-weight: bold;
      margin-top: 5px;
    }

    #reader {
      width: 100%;
      background: white;
      margin-top: 15px;
    }

    #status {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-top: 15px;
      font-size: 20px;
      min-height: 30px;
      transition: background 0.15s ease;
    }

    #lastItem {
      font-size: 22px;
      font-weight: bold;
    }

    #counter {
      font-size: 28px;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      font-size: 18px;
      border: 0;
      border-radius: 10px;
    }

    #startButton {
      background: #1677ff;
      color: white;
    }

    #undoButton {
      background: #ff9800;
      color: white;
      font-weight: bold;
    }

    #undoButton:disabled {
      background: #cccccc;
      color: #777777;
    }

    #clearButton {
      background: #ddd;
    }

    .success {
      background: #22c55e !important;
      color: white !important;
      font-weight: bold;
    }

    .error {
      background: #ef4444 !important;
      color: white !important;
      font-weight: bold;
    }

    .undo {
      background: #ff9800 !important;
      color: white !important;
      font-weight: bold;
    }

  </style>

</head>


<body>


<h1>Inventory Scanner</h1>


<div class="box">

  Current Location

  <div id="location">
    Not selected
  </div>

</div>


<div class="box">

  Last Item

  <div id="lastItem">
    —
  </div>

</div>


<div class="box">

  Items Scanned

  <div id="counter">
    0
  </div>

</div>


<button id="startButton">
  START SCANNER
</button>


<div id="reader"></div>


<div id="status">
  Scan Location QR first
</div>


<button
  id="undoButton"
  disabled
>
  UNDO LAST ITEM
</button>


<button id="clearButton">
  CLEAR LOCATION
</button>



<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbyZwLEiOopCUoR66P5vNt7yBE4wXeNhStdfBopXbRErUFgQwiirXuH4LBYN9OlB3CmR/exec";



let currentLocation =
localStorage.getItem("inventoryLocation") || "";


let scanner = null;

let scannedCount = 0;

let audioContext = null;


/*
  Information about the last
  successfully scanned item.
*/

let lastSuccessfulScan = null;



/*
  Same QR cannot be processed again
  for 8 seconds.
*/

const recentScans =
new Map();


const SAME_QR_LOCK_TIME =
8000;



const locationDisplay =
document.getElementById("location");


const statusDisplay =
document.getElementById("status");


const lastItemDisplay =
document.getElementById("lastItem");


const counterDisplay =
document.getElementById("counter");


const startButton =
document.getElementById("startButton");


const undoButton =
document.getElementById("undoButton");


const clearButton =
document.getElementById("clearButton");



if (currentLocation) {

  locationDisplay.innerText =
  currentLocation;

  statusDisplay.innerText =
  "Ready. Scan Item QR.";

}



startButton.addEventListener(
  "click",
  startScanner
);


undoButton.addEventListener(
  "click",
  undoLastItem
);


clearButton.addEventListener(
  "click",
  clearLocation
);



function startScanner() {


  /*
    Unlock audio on iPhone.
  */

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!audioContext) {

      audioContext =
      new AudioContext();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    const unlockOscillator =
      audioContext.createOscillator();


    const unlockGain =
      audioContext.createGain();


    unlockGain.gain.value =
      0.0001;


    unlockOscillator.connect(
      unlockGain
    );


    unlockGain.connect(
      audioContext.destination
    );


    unlockOscillator.start();


    unlockOscillator.stop(
      audioContext.currentTime +
      0.05
    );


  } catch(e) {}



  statusDisplay.innerText =
  "Starting camera...";


  scanner =
  new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    onScanSuccess,

    function () {}

  )


  .then(function () {


    startButton.style.display =
    "none";


    if (currentLocation) {

      statusDisplay.innerText =
      "Ready. Scan Item QR.";

    } else {

      statusDisplay.innerText =
      "Scan Location QR first";

    }

  })


  .catch(function(error) {

    statusDisplay.innerText =
    "Camera error: " + error;

  });

}



function onScanSuccess(decodedText) {


  const now =
    Date.now();


  const code =
    decodedText.trim();



  /*
    DUPLICATE PROTECTION
  */

  const previousScan =
    recentScans.get(code) || 0;


  if (

    now - previousScan <
    SAME_QR_LOCK_TIME

  ) {

    return;

  }


  recentScans.set(
    code,
    now
  );



  for (

    const [savedCode, savedTime]
    of recentScans

  ) {

    if (

      now - savedTime >
      SAME_QR_LOCK_TIME

    ) {

      recentScans.delete(
        savedCode
      );

    }

  }



  /*
    LOCATION QR
    Example: L:1
  */

  if (

    code.toUpperCase()
      .startsWith("L:")

  ) {


    const location =
      code.substring(2).trim();


    if (!location) {

      return;

    }


    currentLocation =
      location;


    localStorage.setItem(

      "inventoryLocation",

      currentLocation

    );


    locationDisplay.innerText =
      currentLocation;


    statusDisplay.className =
      "success";


    statusDisplay.innerText =

      "✓ Location " +

      currentLocation +

      " selected";


    vibrate();

    playLocationTone();


    return;

  }



  /*
    ITEM QR
    Example: I:5067
  */

  if (

    code.toUpperCase()
      .startsWith("I:")

  ) {


    const item =
      code.substring(2).trim();


    if (!item) {

      return;

    }


    if (!currentLocation) {


      showError(
        "Scan Location first"
      );


      return;

    }


    saveItem(item);


    return;

  }



  showError(
    "Unknown QR: " + code
  );

}



function saveItem(item) {


  statusDisplay.className =
    "";


  statusDisplay.innerText =

    "Saving Item #" +

    item +

    "...";



  const callbackName =

    "inventoryCallback_" +

    Date.now();



  const script =
    document.createElement(
      "script"
    );



  const url =

    API_URL +

    "?action=update" +

    "&item=" +

    encodeURIComponent(item) +

    "&location=" +

    encodeURIComponent(
      currentLocation
    ) +

    "&callback=" +

    encodeURIComponent(
      callbackName
    ) +

    "&t=" +

    Date.now();



  let finished = false;



  window[callbackName] =

  function(data) {


    finished = true;



    if (data.success) {


      /*
        Store information required
        to undo this scan.
      */

      lastSuccessfulScan = {

        item:
          item,

        previousLocation:
          data.previousLocation || "",

        newLocation:
          currentLocation

      };


      undoButton.disabled =
        false;



      scannedCount++;


      counterDisplay.innerText =
        scannedCount;


      lastItemDisplay.innerText =
        "#" + item;


      statusDisplay.className =
        "success";


      statusDisplay.innerText =

        "✓ Item #" +

        item +

        " → Location " +

        currentLocation;


      vibrateSuccess();


    } else {


      showError(

        data.message ||

        "Item not found"

      );

    }



    cleanup();

  };



  script.onerror =
  function() {


    if (!finished) {


      showError(
        "Could not reach server"
      );

    }


    cleanup();

  };



  script.src =
    url;


  document.body.appendChild(
    script
  );



  setTimeout(function() {


    if (!finished) {


      showError(
        "Server timeout"
      );


      cleanup();

    }

  }, 10000);



  function cleanup() {


    if (script.parentNode) {

      script.parentNode
        .removeChild(
          script
        );

    }


    try {

      delete window[
        callbackName
      ];

    } catch(e) {}

  }

}



/*
  =========================
  UNDO LAST ITEM
  =========================
*/

function undoLastItem() {


  if (!lastSuccessfulScan) {

    return;

  }


  const item =
    lastSuccessfulScan.item;


  const previousLocation =
    lastSuccessfulScan
      .previousLocation;


  /*
    Disable button immediately
    so it cannot be pressed twice.
  */

  undoButton.disabled =
    true;


  statusDisplay.className =
    "";


  statusDisplay.innerText =

    "Undoing Item #" +

    item +

    "...";



  const callbackName =

    "undoCallback_" +

    Date.now();



  const script =
    document.createElement(
      "script"
    );



  const url =

    API_URL +

    "?action=undo" +

    "&item=" +

    encodeURIComponent(item) +

    "&previousLocation=" +

    encodeURIComponent(
      previousLocation
    ) +

    "&callback=" +

    encodeURIComponent(
      callbackName
    ) +

    "&t=" +

    Date.now();



  let finished = false;



  window[callbackName] =

  function(data) {


    finished = true;



    if (data.success) {


      if (scannedCount > 0) {

        scannedCount--;

      }


      counterDisplay.innerText =
        scannedCount;


      lastItemDisplay.innerText =
        "—";


      statusDisplay.className =
        "undo";


      if (previousLocation) {


        statusDisplay.innerText =

          "↶ Item #" +

          item +

          " restored to Location " +

          previousLocation;


      } else {


        statusDisplay.innerText =

          "↶ Item #" +

          item +

          " restored to blank location";

      }


      /*
        Allow the same QR to be
        scanned again immediately
        after UNDO.
      */

      recentScans.delete(
        "I:" + item
      );


      lastSuccessfulScan =
        null;


      playUndoTone();


    } else {


      showError(

        data.message ||

        "Undo failed"

      );


      /*
        Re-enable button if
        server rejected undo.
      */

      undoButton.disabled =
        false;

    }



    cleanup();

  };



  script.onerror =
  function() {


    if (!finished) {


      showError(
        "Could not undo item"
      );


      undoButton.disabled =
        false;

    }


    cleanup();

  };



  script.src =
    url;


  document.body.appendChild(
    script
  );



  setTimeout(function() {


    if (!finished) {


      showError(
        "Undo server timeout"
      );


      undoButton.disabled =
        false;


      cleanup();

    }

  }, 10000);



  function cleanup() {


    if (script.parentNode) {

      script.parentNode
        .removeChild(
          script
        );

    }


    try {

      delete window[
        callbackName
      ];

    } catch(e) {}

  }

}



function showError(message) {


  statusDisplay.className =
    "error";


  statusDisplay.innerText =

    "ERROR: " +

    message;


  vibrateError();

}



function clearLocation() {


  currentLocation =
    "";


  localStorage.removeItem(
    "inventoryLocation"
  );


  locationDisplay.innerText =
    "Not selected";


  lastItemDisplay.innerText =
    "—";


  scannedCount =
    0;


  counterDisplay.innerText =
    "0";


  statusDisplay.className =
    "";


  statusDisplay.innerText =
    "Scan Location QR first";


  recentScans.clear();


  lastSuccessfulScan =
    null;


  undoButton.disabled =
    true;

}



function vibrate() {


  if (navigator.vibrate) {

    navigator.vibrate(100);

  }

}



function playTone(
  frequency,
  duration,
  volume
) {


  try {


    if (!audioContext) {

      return;

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    const oscillator =
      audioContext
        .createOscillator();


    const gain =
      audioContext
        .createGain();


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      frequency;


    gain.gain.setValueAtTime(

      volume || 0.35,

      audioContext.currentTime

    );


    gain.gain
      .exponentialRampToValueAtTime(

        0.01,

        audioContext.currentTime +
        duration / 1000

      );


    oscillator.start();


    oscillator.stop(

      audioContext.currentTime +
      duration / 1000

    );


  } catch(e) {}

}



function playLocationTone() {


  playTone(
    650,
    120,
    0.25
  );

}



function vibrateSuccess() {


  if (navigator.vibrate) {

    navigator.vibrate(
      [100, 50, 100]
    );

  }


  playTone(
    850,
    120,
    0.35
  );


  setTimeout(function() {

    playTone(
      1150,
      160,
      0.35
    );

  }, 130);

}



function vibrateError() {


  if (navigator.vibrate) {

    navigator.vibrate(
      [300, 100, 300]
    );

  }


  playTone(
    220,
    450,
    0.4
  );

}



function playUndoTone() {


  if (navigator.vibrate) {

    navigator.vibrate(
      [80, 50, 80]
    );

  }


  playTone(
    700,
    120,
    0.3
  );


  setTimeout(function() {

    playTone(
      500,
      180,
      0.3
    );

  }, 130);

}


</script>

</body>

</html>
