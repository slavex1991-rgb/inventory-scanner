<script>

0;

// ==========================================
// PRINT QR LABEL
// ==========================================

function printQrLabel() {

  const item =
  cleanItem(
    manualItem.value
  );

  if (!item) {
    showError(
      "Enter Item #"
    );
    return;
  }

  if (typeof QRCode === "undefined") {
    showError(
      "QR generator not loaded. Refresh page."
    );
    return;
  }

  const qrPayload =
  "I:" + item;

  /*
    Generate QR on the MAIN scanner page first.
    This is more reliable on iPhone Safari than
    loading the QR library inside the print window.
  */
  const qrHolder =
  document.createElement("div");

  qrHolder.style.position = "fixed";
  qrHolder.style.left = "-10000px";
  qrHolder.style.top = "0";

  document.body.appendChild(
    qrHolder
  );

  new QRCode(
    qrHolder,
    {
      text: qrPayload,
      width: 600,
      height: 600,
      correctLevel:
        QRCode.CorrectLevel.M
    }
  );

  setTimeout(
    function() {

      let qrDataUrl = "";

      const canvas =
      qrHolder.querySelector(
        "canvas"
      );

      const img =
      qrHolder.querySelector(
        "img"
      );

      if (canvas) {
        try {
          qrDataUrl =
          canvas.toDataURL(
            "image/png"
          );
        } catch(e) {}
      }

      if (
        !qrDataUrl &&
        img &&
        img.src
      ) {
        qrDataUrl =
        img.src;
      }

      qrHolder.remove();

      if (!qrDataUrl) {
        showError(
          "Could not create QR code"
        );
        return;
      }

      const printWindow =
      window.open(
        "",
        "_blank"
      );

      if (!printWindow) {
        showError(
          "Allow pop-ups to print label"
        );
        return;
      }

      printWindow.document.open();

      printWindow.document.write(
      '<!DOCTYPE html>' +
'<html><head>' +
'<meta charset="UTF-8">' +
'<meta name="viewport" content="width=device-width, initial-scale=1.0">' +
'<title>Item ' + escapeHtml(item) + '</title>' +
'<style>' +
'@page { size: 62mm 100mm; margin: 0; }' +
'html, body { width: 62mm; height: 100mm; margin: 0; padding: 0; background: white; }' +
'body { font-family: Arial, sans-serif; color: black; }' +
'.labelPage { width: 62mm; height: 100mm; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; }' +
'#qrImage { width: 50mm; height: 50mm; display: block; image-rendering: pixelated; }' +
'#itemNumber { margin-top: 5mm; font-size: 16mm; line-height: 1; font-weight: 700; text-align: center; }' +
'@media print { @page { size: 62mm 100mm; margin: 0; } html, body { margin: 0 !important; padding: 0 !important; } }' +
'</style>' +
'</head><body>' +
'<div class="labelPage">' +
'<img id="qrImage" alt="QR Code">' +
'<div id="itemNumber">' + escapeHtml(item) + '</div>' +
'</div>' +
'<script>' +
'var img = document.getElementById("qrImage");' +
'img.onload = function() {' +
'  setTimeout(function() { window.print(); }, 250);' +
'};' +
'window.onafterprint = function() {' +
'  setTimeout(function() { window.close(); }, 300);' +
'};' +
'img.src = ' + JSON.stringify(qrDataUrl) + ';' +
'</\script>' +
'</body></html>'
      );

      printWindow.document.close();

      setStatus(
        "",
        "Print label for Item #" +
        item
      );

    },
    150
  );
}


// ==========================================
// CAMERA
// ==========================================

function startScanner() {

  if (scannerStarted) {
    return;
  }


  unlockAudio();


  setStatus(
    "",
    "Starting camera..."
  );


  scanner =
  new Html5Qrcode(
    "reader"
  );


  scanner.start(

    {
      facingMode:
        "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    onScanSuccess,

    function() {}

  )

  .then(function() {

    scannerStarted =
    true;

    startButton.style.display =
    "none";

stopButton.style.display = "block";
    if (
      currentMode === "lookup"
    ) {

      setStatus(
        "lookupStatus",
        "Scan Product QR"
      );

    } else if (
      currentLocation
    ) {

      setStatus(
        "",
        "Ready. Scan Item QR."
      );

    } else {

      setStatus(
        "",
        "Scan Location QR first"
      );

    }

  })

  .catch(function(error) {

    showError(
      "Camera error: " +
      error
    );

  });

}
  function stopScanner() {

  if (!scannerStarted || !scanner) {
    return;
  }

  scanner.stop()
    .then(function() {

      scannerStarted = false;

      startButton.style.display = "block";
stopButton.style.display = "none";
      setStatus(
        "",
        "Camera stopped"
      );

    })
    .catch(function(error) {

      showError(
        "Could not stop camera: " +
        error
      );

    });
}



// ==========================================
// QR SCAN
// ==========================================

function onScanSuccess(
  decodedText
) {

  if (
    inventoryOperationInProgress &&
    currentMode === "inventory"
  ) {
    return;
  }


  const code =
  String(decodedText || "")
    .trim();


  const now =
  Date.now();


  const previous =
  recentScans.get(code) || 0;


  if (
    now - previous <
    SAME_QR_LOCK_TIME
  ) {

    return;

  }


  recentScans.set(
    code,
    now
  );


  cleanRecentScans(now);



  // LOOKUP MODE

  if (
    currentMode === "lookup"
  ) {

    if (
      code.toUpperCase()
        .startsWith("I:")
    ) {

      const item =
      cleanItem(
        code.substring(2)
      );

      lookupItem(item);

      return;
    }


    showError(
      "Scan Item QR"
    );

    return;
  }



  // LOCATION QR

  if (
    code.toUpperCase()
      .startsWith("L:")
  ) {

    const location =
    code.substring(2)
      .trim();


    if (!location) {
      return;
    }


    currentLocation =
    location;


    localStorage.setItem(
      "inventoryLocation",
      currentLocation
    );


    locationDisplay.innerText =
    currentLocation;


    setStatus(
      "success",
      "✓ LOCATION " +
      currentLocation
    );


    playLocationTone();

    return;
  }



  // ITEM QR

  if (
    code.toUpperCase()
      .startsWith("I:")
  ) {

    const item =
    cleanItem(
      code.substring(2)
    );


    if (!currentLocation) {

      showError(
        "Scan Location first"
      );

      return;
    }


    saveItem(
      item,
      "camera"
    );

    return;
  }


  showError(
    "Unknown QR"
  );

}



// ==========================================
// SAVE / MOVE
// ==========================================

function saveItem(item, source) {

  if (!item) return;

  if (inventoryOperationInProgress) {
    setStatus(
      "move",
      "⚠️ VERIFYING PREVIOUS SCAN<br>DO NOT RESCAN",
      true
    );
    return;
  }

  inventoryOperationInProgress = true;

  const transactionId = createTransactionId(item);

  setStatus(
    "",
    "Saving Item #" + item + "..."
  );

  sendInventoryTransaction(
    item,
    currentLocation,
    transactionId,
    0
  );
}


function sendInventoryTransaction(
  item,
  location,
  transactionId,
  retryNumber
) {

  jsonpRequest(
    "update",
    {
      item: item,
      location: location,
      transactionId: transactionId
    },

    function(data) {

      if (!data.success) {
        inventoryOperationInProgress = false;

        if (data.errorType === "ITEM_NOT_FOUND") {
          showItemNotFound(item);
        } else if (data.errorType === "DIFFERENT_LOCATION") {
          showProductCard({
            item: data.item || item,
            name: data.name || "",
            price: data.price,
            location: data.currentLocation || "",
            quantity: Number(data.quantity || 1),
            itemColor: data.itemColor || ""
          });

          setStatus(
            "move",
            "⚠️ ITEM ALREADY IN ANOTHER LOCATION" +
            "<br><br>ITEM #" + escapeHtml(data.item || item) +
            "<br>" + escapeHtml(data.name || "") +
            "<br><br>CURRENT LOCATION: " + escapeHtml(data.currentLocation || "—") +
            "<br>SELECTED LOCATION: " + escapeHtml(data.requestedLocation || location) +
            "<br><br>QUANTITY: " + Number(data.quantity || 1) +
            "<br><br>LOCATION WAS NOT CHANGED",
            true
          );

          addHistory(
            "⚠ #" + (data.item || item) +
            " | Kept at " + (data.currentLocation || "—") +
            " | Qty " + Number(data.quantity || 1)
          );

          playMoveTone();
        } else if (
          data.errorType === "TRANSACTION_UNCERTAIN" ||
          data.errorType === "VERIFY_FAILED"
        ) {
          setStatus(
            "error",
            "⚠️ NOT VERIFIED" +
            "<br><br>ITEM #" + escapeHtml(item) +
            "<br><br>DO NOT RESCAN THIS ITEM",
            true
          );
          playErrorTone();
        } else {
          showError(data.message || "Update failed");
        }
        return;
      }

      inventoryOperationInProgress = false;

      const previousQuantity =
        Number(data.previousQuantity || 0);

      const newQuantity =
        Number(data.quantity || 1);

      lastSuccessfulScan = {
        item: data.item || item,
        name: data.name || "",
        price: data.price,
        action: data.action,
        previousLocation: data.previousLocation || "",
        newLocation: data.newLocation || location,
        previousQuantity: previousQuantity,
        quantity: newQuantity,
        itemColor: data.itemColor || "",
        transactionId: transactionId
      };

      undoButton.disabled = false;

      totalScanCount++;
      uniqueItemSet.add(String(data.item || item));

      if (data.action === "FIRST") {
        unitsAddedCount++;
      }

      updateStats();

      showProductCard({
        item: data.item || item,
        name: data.name,
        price: data.price,
        location: data.newLocation || location,
        quantity: newQuantity,
        itemColor: data.itemColor || ""
      });

      const verifiedText =
        data.replayed
          ? "✓ ALREADY SAVED & VERIFIED"
          : "✓ SAVED & VERIFIED";

      if (
        data.action === "MOVE" ||
        data.locationChanged === true
      ) {
        setStatus(
          "move",
          verifiedText +
          "<br><br>⚠️ LOCATION CHANGED" +
          "<br><br>ITEM #" + escapeHtml(data.item || item) +
          "<br>" + escapeHtml(data.name || "") +
          "<br><br>MOVED:" +
          "<br>LOCATION " + escapeHtml(data.previousLocation) +
          " → LOCATION " + escapeHtml(data.newLocation) +
          "<br><br>QUANTITY: " + newQuantity,
          true
        );

        addHistory(
          "↔ #" + (data.item || item) +
          " | " + data.previousLocation +
          " → " + data.newLocation +
          " | Qty " + newQuantity
        );

        playMoveTone();

      } else {
        setStatus(
          "success",
          verifiedText +
          "<br><br>ITEM #" + escapeHtml(data.item || item) +
          "<br>" + escapeHtml(data.name || "") +
          "<br><br>QUANTITY: " +
          previousQuantity + " → " + newQuantity +
          "<br>LOCATION: " + escapeHtml(data.newLocation),
          true
        );

        addHistory(
          "+ #" + (data.item || item) +
          " | Location " + data.newLocation +
          " | Qty " + newQuantity
        );

        playSuccessTone();
      }

      manualItem.value = "";
    },

    function() {

      if (retryNumber < 2) {
        setStatus(
          "move",
          "⚠️ VERIFYING SAVE STATUS..." +
          "<br><br>ITEM #" + escapeHtml(item) +
          "<br>DO NOT RESCAN",
          true
        );

        setTimeout(function() {
          sendInventoryTransaction(
            item,
            location,
            transactionId,
            retryNumber + 1
          );
        }, 1500);

        return;
      }

      inventoryOperationInProgress = false;

      setStatus(
        "error",
        "⚠️ SAVE STATUS UNKNOWN" +
        "<br><br>ITEM #" + escapeHtml(item) +
        "<br><br>DO NOT RESCAN THIS ITEM",
        true
      );

      playErrorTone();
    }
  );
}

// ==========================================
// PRODUCT CARD
// ==========================================

function showProductCard(
  data
) {

  productCard.style.display =
  "block";


  const itemColor =
  String(data.itemColor || "").trim();

  productCard.style.backgroundColor =
  itemColor || "white";

  let cardTextColor = "#111";

  if (/^#[0-9a-fA-F]{6}$/.test(itemColor)) {
    const r = parseInt(itemColor.substring(1, 3), 16);
    const g = parseInt(itemColor.substring(3, 5), 16);
    const b = parseInt(itemColor.substring(5, 7), 16);
    const luminance = (0.299 * r) + (0.587 * g) + (0.114 * b);

    cardTextColor =
      luminance < 145
        ? "white"
        : "#111";
  }

  productCard.style.color =
  cardTextColor;

  const productRows =
  productCard.querySelectorAll(".productRow");

  productRows.forEach(function(row) {
    row.style.borderBottomColor =
      cardTextColor === "white"
        ? "rgba(255,255,255,0.35)"
        : "#eee";
  });


  productName.innerText =
  data.name ||
  "No product name";


  productItem.innerText =
  data.item ||
  "—";


  if (
    data.price !== "" &&
    data.price !== null &&
    data.price !== undefined
  ) {

    const price =
    Number(
      data.price
    );


    if (!isNaN(price)) {

      productPrice.innerText =
      "$" +
      price.toFixed(2);

    } else {

      productPrice.innerText =
      data.price;

    }

  } else {

    productPrice.innerText =
    "—";

  }


  productLocation.innerText =
  data.location ||
  "Not assigned";


 let shownQuantity =
Math.floor(
  Number(data.quantity || 0)
);

if (isNaN(shownQuantity) || shownQuantity < 0) {
  shownQuantity = 0;
}

productQuantity.innerText =
shownQuantity;

quantityInput.value =
shownQuantity;

  productCardItem =
  String(data.item || "");

  productCardQuantity =
  shownQuantity;

}

// UNDO
// ==========================================

function undoLastItem() {

  if (!lastSuccessfulScan) {
    return;
  }


  const undoData =
  lastSuccessfulScan;


  undoButton.disabled =
  true;


  setStatus(
    "",
    "Undoing Item #" +
    undoData.item +
    "..."
  );


  jsonpRequest(

    "undo",

    {

      item:
        undoData.item,

      previousLocation:
        undoData.previousLocation,

      previousQuantity:
        undoData.previousQuantity

    },

    function(data) {


      if (!data.success) {

        showError(
          data.message ||
          "Undo failed"
        );


        undoButton.disabled =
        false;

        return;
      }



      /*
        Adjust session counters.
      */

      if (totalScanCount > 0) {

        totalScanCount--;

      }


      if (
        undoData.action === "FIRST" ||
        undoData.action === "ADD"
      ) {

        if (
          unitsAddedCount > 0
        ) {

          unitsAddedCount--;

        }

      }


      updateStats();



      showProductCard({

        item:
          undoData.item,

        name:
          undoData.name,

        price:
          undoData.price,

        location:
          data.restoredLocation,

        quantity:
          data.restoredQuantity,

        itemColor:
          undoData.itemColor || ""

      });



      if (
        undoData.action === "MOVE"
      ) {

        setStatus(

          "undo",

          "↶ MOVE UNDONE" +

          "<br><br>" +

          "ITEM #" +
          escapeHtml(
            undoData.item
          ) +

          "<br>" +

          "LOCATION " +
          escapeHtml(
            undoData.newLocation
          ) +

          " → LOCATION " +
          escapeHtml(
            data.restoredLocation
          ) +

          "<br>" +

          "QUANTITY: " +
          Number(
            data.restoredQuantity || 0
          ),

          true
        );


        addHistory(

          "↶ #" +
          undoData.item +

          " | " +
          undoData.newLocation +

          " → " +
          (
            data.restoredLocation ||
            "blank"
          )

        );

      } else {

        setStatus(

          "undo",

          "↶ UNDO SUCCESSFUL" +

          "<br>" +

          "ITEM #" +
          escapeHtml(
            undoData.item
          ) +

          "<br>" +

          "LOCATION: " +
          escapeHtml(
            data.restoredLocation ||
            "BLANK"
          ) +

          "<br>" +

          "QUANTITY: " +
          Number(
            data.restoredQuantity || 0
          ),

          true
        );


        addHistory(

          "↶ #" +
          undoData.item +

          " | Qty " +
          Number(
            data.restoredQuantity || 0
          )

        );

      }



      /*
        Permit immediate re-scan.
      */

      recentScans.delete(
        "I:" +
        undoData.item
      );


      lastSuccessfulScan =
      null;


      playUndoTone();

    }

  );

}

// ==========================================
// JSONP
// ==========================================

function jsonpRequest(
  action,
  parameters,
  callback,
  failureCallback
) {

  const callbackName =
    "inventoryCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 1000000);

  const script = document.createElement("script");
  let finished = false;
  let timeoutId = null;

  window[callbackName] = function(data) {
    if (finished) return;

    finished = true;

    if (timeoutId) {
      clearTimeout(timeoutId);
    }

    try {
      callback(data);
    } finally {
      cleanup();
    }
  };

  let url =
    API_URL +
    "?action=" +
    encodeURIComponent(action);

  for (const key in parameters) {
    if (
      Object.prototype.hasOwnProperty.call(
        parameters,
        key
      )
    ) {
      url +=
        "&" +
        encodeURIComponent(key) +
        "=" +
        encodeURIComponent(parameters[key]);
    }
  }

  url +=
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();

  script.async = true;
  script.src = url;

  script.onerror = function() {
    if (finished) return;

    finished = true;

    if (timeoutId) {
      clearTimeout(timeoutId);
    }

    cleanup();

    if (failureCallback) {
      failureCallback("network");
    } else {
      showError("Could not reach server");
    }
  };

  document.head.appendChild(script);

  timeoutId = setTimeout(
    function() {
      if (finished) return;

      finished = true;
      cleanup();

      if (failureCallback) {
        failureCallback("timeout");
      } else {
        showError("Server timeout");
      }
    },
    15000
  );

  function cleanup() {
    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    setTimeout(function() {
      try {
        delete window[callbackName];
      } catch(e) {
        window[callbackName] = undefined;
      }
    }, 1000);
  }
}



// ==========================================
// HELPERS
// ==========================================

function createTransactionId(item) {
  return (
    "scan-" +
    Date.now() +
    "-" +
    String(item) +
    "-" +
    Math.random().toString(36).substring(2, 10)
  );
}


function cleanItem(value) {

  return String(
    value || ""
  )
    .replace("#", "")
    .replace(/^I:/i, "")
    .trim();

}


function cleanRecentScans(now) {

  for (
    const [
      code,
      time
    ] of recentScans
  ) {

    if (
      now - time >
      SAME_QR_LOCK_TIME
    ) {

      recentScans.delete(
        code
      );

    }

  }

}


function setStatus(
  className,
  content,
  allowHtml
) {

  statusDisplay.className =
  className || "";


  if (allowHtml) {

    statusDisplay.innerHTML =
    content;

  } else {

    statusDisplay.innerText =
    content;

  }

}


function showError(message) {

  setStatus(
    "error",
    "ERROR: " +
    message
  );


  playErrorTone();

}


function escapeHtml(value) {

  return String(
    value == null
      ? ""
      : value
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



// ==========================================
// AUDIO
// ==========================================

function unlockAudio() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!audioContext) {

      audioContext =
      new AudioContext();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    const oscillator =
      audioContext
        .createOscillator();


    const gain =
      audioContext
        .createGain();


    gain.gain.value =
    0.0001;


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime +
      0.05
    );


  } catch(e) {}

}


function playTone(
  frequency,
  duration,
  volume
) {

  try {

    if (!audioContext) {
      return;
    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    const oscillator =
      audioContext
        .createOscillator();


    const gain =
      audioContext
        .createGain();


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.type =
    "sine";


    oscillator.frequency.value =
    frequency;


    gain.gain.setValueAtTime(

      volume || 0.35,

      audioContext.currentTime

    );


    gain.gain
      .exponentialRampToValueAtTime(

        0.01,

        audioContext.currentTime +
        duration / 1000

      );


    oscillator.start();


    oscillator.stop(

      audioContext.currentTime +
      duration / 1000

    );


  } catch(e) {}

}

    650,
    120,
    0.25
