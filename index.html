<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Inventory Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 650px;
  margin: auto;
  padding: 14px;
  text-align: center;
  background: #f3f4f6;
  color: #111;
}

h1 {
  margin: 8px 0 15px;
  font-size: 28px;
}

.box {
  background: white;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 12px;
}

.label {
  font-size: 14px;
  color: #666;
  text-transform: uppercase;
  margin-bottom: 5px;
}

#modeDisplay {
  font-size: 20px;
  font-weight: bold;
}

#location {
  font-size: 40px;
  font-weight: bold;
}

.modeButtons {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.modeButtons button {
  margin: 0;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 9px;
  font-size: 17px;
  font-weight: bold;
  border: 0;
  border-radius: 11px;
  cursor: pointer;
}

#inventoryButton {
  background: #1677ff;
  color: white;
}

#lookupButton {
  background: #6f42c1;
  color: white;
}

#startButton {
  background: #111827;
  color: white;
}

#undoButton {
  background: #ff9800;
  color: white;
}

#undoButton:disabled {
  background: #d1d5db;
  color: #777;
}

#clearButton {
  background: #e5e7eb;
  color: #111;
}

#reader {
  width: 100%;
  background: white;
  margin-top: 12px;
  border-radius: 12px;
  overflow: hidden;
}

#status {
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin-top: 12px;
  font-size: 20px;
  min-height: 30px;
  line-height: 1.45;
}

.success {
  background: #22c55e !important;
  color: white !important;
}

.move {
  background: #f59e0b !important;
  color: white !important;
}

.error {
  background: #dc2626 !important;
  color: white !important;
}

.lookupStatus {
  background: #6f42c1 !important;
  color: white !important;
}

.undo {
  background: #f97316 !important;
  color: white !important;
}

.notFound {
  background: #b91c1c !important;
  color: white !important;
  font-size: 27px !important;
  font-weight: bold;
  padding: 28px 15px !important;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.stat {
  background: white;
  border-radius: 12px;
  padding: 12px 5px;
}

.statNumber {
  font-size: 28px;
  font-weight: bold;
}

.statLabel {
  font-size: 11px;
  color: #666;
  margin-top: 4px;
}

.inputBox {
  background: white;
  border-radius: 14px;
  padding: 15px;
  margin-top: 12px;
}

input {
  box-sizing: border-box;
  width: 100%;
  padding: 14px;
  border: 1px solid #bbb;
  border-radius: 9px;
  font-size: 18px;
  margin-top: 7px;
}

.inputButtons {
  display: flex;
  gap: 8px;
}

.inputButtons button {
  flex: 1;
}

#manualScanButton {
  background: #1677ff;
  color: white;
}

#manualLookupButton {
  background: #6f42c1;
  color: white;
}

#searchNameButton {
  background: #374151;
  color: white;
}

#productCard {
  display: none;
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin-top: 12px;
  text-align: left;
}

#productName {
  font-size: 23px;
  font-weight: bold;
  margin-bottom: 12px;
}

.productRow {
  padding: 8px 0;
  border-bottom: 1px solid #eee;
  font-size: 18px;
}

#productQuantity {
  font-size: 26px;
  font-weight: bold;
}

#searchResults {
  display: none;
  background: white;
  border-radius: 14px;
  padding: 12px;
  margin-top: 12px;
  text-align: left;
}

.searchResult {
  padding: 13px 8px;
  border-bottom: 1px solid #ddd;
  cursor: pointer;
}

.searchResult:last-child {
  border-bottom: 0;
}

.searchName {
  font-size: 17px;
  font-weight: bold;
}

.searchDetails {
  color: #555;
  margin-top: 5px;
  font-size: 14px;
}

#historyBox {
  background: white;
  border-radius: 14px;
  padding: 15px;
  margin-top: 12px;
  text-align: left;
}

.historyItem {
  padding: 9px 0;
  border-bottom: 1px solid #eee;
  font-size: 15px;
}

.small {
  font-size: 13px;
  color: #666;
}
</style>
</head>

<body>

<h1>Inventory Scanner</h1>

<div class="box">
  <div class="label">Mode</div>
  <div id="modeDisplay">INVENTORY / MOVE</div>
</div>

<div class="modeButtons">
  <button id="inventoryButton">📦 INVENTORY</button>
  <button id="lookupButton">🔍 LOOKUP</button>
</div>

<div class="box">
  <div class="label">Current Location</div>
  <div id="location">Not selected</div>
</div>

<div class="stats">

  <div class="stat">
    <div class="statNumber" id="totalScans">0</div>
    <div class="statLabel">TOTAL SCANS</div>
  </div>

  <div class="stat">
    <div class="statNumber" id="uniqueItems">0</div>
    <div class="statLabel">UNIQUE ITEMS</div>
  </div>

  <div class="stat">
    <div class="statNumber" id="totalUnits">0</div>
    <div class="statLabel">UNITS ADDED</div>
  </div>

</div>

<button id="startButton">START SCANNER</button>

<div id="reader"></div>

<div id="status">Scan Location QR first</div>

<div class="inputBox">
  <div class="label">Manual Item #</div>

  <input
    id="manualItem"
    type="text"
    inputmode="numeric"
    placeholder="Example: 5067"
  >

  <div class="inputButtons">
    <button id="manualScanButton">ADD / MOVE</button>
    <button id="manualLookupButton">LOOKUP</button>
  </div>
</div>

<div class="inputBox">
  <div class="label">Search Product Name</div>

  <input
    id="nameSearch"
    type="text"
    placeholder="Example: Tacoma"
  >

  <button id="searchNameButton">
    SEARCH BY NAME
  </button>
</div>

<div id="searchResults"></div>

<div id="productCard">

  <div id="productName">—</div>

  <div class="productRow">
    Item #:
    <span id="productItem">—</span>
  </div>

  <div class="productRow">
    Price:
    <span id="productPrice">—</span>
  </div>

  <div class="productRow">
    Location:
    <span id="productLocation">—</span>
  </div>

  <div class="productRow">
    Quantity:
    <span id="productQuantity">—</span>
  </div>

</div>

<button id="undoButton" disabled>
  ↶ UNDO LAST ITEM
</button>

<button id="clearButton">
  CLEAR LOCATION
</button>

<div id="historyBox">
  <strong>Recent Activity</strong>
  <div id="historyList" class="small">
    No activity yet
  </div>
</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyZwLEiOopCUoR66P5vNt7yBE4wXeNhStdfBopXbRErUFgQwiirXuH4LBYN9OlB3CmR/exec";

const SAME_QR_LOCK_TIME = 8000;

let currentLocation =
localStorage.getItem("inventoryLocation") || "";

let currentMode = "inventory";
let scanner = null;
let scannerStarted = false;
let audioContext = null;
let lastSuccessfulScan = null;

let totalScanCount = 0;
let unitsAddedCount = 0;

let uniqueItemSet = new Set();
let history = [];
const recentScans = new Map();

const locationDisplay =
document.getElementById("location");

const modeDisplay =
document.getElementById("modeDisplay");

const statusDisplay =
document.getElementById("status");

const startButton =
document.getElementById("startButton");

const inventoryButton =
document.getElementById("inventoryButton");

const lookupButton =
document.getElementById("lookupButton");

const undoButton =
document.getElementById("undoButton");

const clearButton =
document.getElementById("clearButton");

const manualItem =
document.getElementById("manualItem");

const manualScanButton =
document.getElementById("manualScanButton");

const manualLookupButton =
document.getElementById("manualLookupButton");

const nameSearch =
document.getElementById("nameSearch");

const searchNameButton =
document.getElementById("searchNameButton");

const searchResults =
document.getElementById("searchResults");

const productCard =
document.getElementById("productCard");

const productName =
document.getElementById("productName");

const productItem =
document.getElementById("productItem");

const productPrice =
document.getElementById("productPrice");

const productLocation =
document.getElementById("productLocation");

const productQuantity =
document.getElementById("productQuantity");

const totalScansDisplay =
document.getElementById("totalScans");

const uniqueItemsDisplay =
document.getElementById("uniqueItems");

const totalUnitsDisplay =
document.getElementById("totalUnits");

const historyList =
document.getElementById("historyList");


if (currentLocation) {

  locationDisplay.innerText =
  currentLocation;

  statusDisplay.innerText =
  "Ready. Scan Item QR.";
}


inventoryButton.addEventListener(
  "click",
  function() {

    currentMode = "inventory";

    modeDisplay.innerText =
    "INVENTORY / MOVE";

    recentScans.clear();

    searchResults.style.display =
    "none";

    if (currentLocation) {

      setStatus(
        "",
        "Ready. Scan Item QR."
      );

    } else {

      setStatus(
        "",
        "Scan Location QR first"
      );
    }
  }
);


lookupButton.addEventListener(
  "click",
  function() {

    currentMode = "lookup";

    modeDisplay.innerText =
    "PRODUCT LOOKUP";

    recentScans.clear();

    setStatus(
      "lookupStatus",
      "Scan Product QR"
    );
  }
);


startButton.addEventListener(
  "click",
  startScanner
);


undoButton.addEventListener(
  "click",
  undoLastItem
);


clearButton.addEventListener(
  "click",
  clearLocation
);


manualScanButton.addEventListener(
  "click",
  function() {

    const item =
    cleanItem(manualItem.value);

    if (!item) {

      showError("Enter Item #");
      return;
    }

    if (!currentLocation) {

      showError("Select Location first");
      return;
    }

    saveItem(
      item,
      "manual"
    );
  }
);


manualLookupButton.addEventListener(
  "click",
  function() {

    const item =
    cleanItem(manualItem.value);

    if (!item) {

      showError("Enter Item #");
      return;
    }

    lookupItem(item);
  }
);


searchNameButton.addEventListener(
  "click",
  searchProductName
);


manualItem.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      const item =
      cleanItem(manualItem.value);

      if (item) {
        lookupItem(item);
      }
    }
  }
);


nameSearch.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {
      searchProductName();
    }
  }
);


// CAMERA

function startScanner() {

  if (scannerStarted) {
    return;
  }

  unlockAudio();

  setStatus(
    "",
    "Starting camera..."
  );

  scanner =
  new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    onScanSuccess,

    function() {}

  )

  .then(function() {

    scannerStarted = true;

    startButton.style.display =
    "none";

    if (currentMode === "lookup") {

      setStatus(
        "lookupStatus",
        "Scan Product QR"
      );

    } else if (currentLocation) {

      setStatus(
        "",
        "Ready. Scan Item QR."
      );

    } else {

      setStatus(
        "",
        "Scan Location QR first"
      );
    }
  })

  .catch(function(error) {

    showError(
      "Camera error: " +
      error
    );
  });
}


// QR SCAN

function onScanSuccess(decodedText) {

  const code =
  String(decodedText || "").trim();

  const now =
  Date.now();

  const previous =
  recentScans.get(code) || 0;

  if (
    now - previous <
    SAME_QR_LOCK_TIME
  ) {
    return;
  }

  recentScans.set(
    code,
    now
  );

  cleanRecentScans(now);


  if (currentMode === "lookup") {

    if (
      code.toUpperCase()
        .startsWith("I:")
    ) {

      const item =
      cleanItem(
        code.substring(2)
      );

      lookupItem(item);
      return;
    }

    showError("Scan Item QR");
    return;
  }


  if (
    code.toUpperCase()
      .startsWith("L:")
  ) {

    const location =
    code.substring(2).trim();

    if (!location) {
      return;
    }

    currentLocation =
    location;

    localStorage.setItem(
      "inventoryLocation",
      currentLocation
    );

    locationDisplay.innerText =
    currentLocation;

    setStatus(
      "success",
      "✓ LOCATION " +
      currentLocation
    );

    playLocationTone();

    return;
  }


  if (
    code.toUpperCase()
      .startsWith("I:")
  ) {

    const item =
    cleanItem(
      code.substring(2)
    );

    if (!currentLocation) {

      showError(
        "Scan Location first"
      );

      return;
    }

    saveItem(
      item,
      "camera"
    );

    return;
  }

  showError("Unknown QR");
}


// SAVE / MOVE

function saveItem(item, source) {

  if (!item) {
    return;
  }

  setStatus(
    "",
    "Checking Item #" +
    item +
    "..."
  );

  jsonpRequest(

    "update",

    {
      item: item,
      location: currentLocation
    },

    function(data) {

      if (!data.success) {

        if (
          data.errorType ===
          "ITEM_NOT_FOUND"
        ) {

          showItemNotFound(item);

        } else {

          showError(
            data.message ||
            "Update failed"
          );
        }

        return;
      }


      const previousQuantity =
      Number(
        data.previousQuantity || 0
      );

      const newQuantity =
      Number(
        data.quantity || 1
      );


      lastSuccessfulScan = {

        item:
          data.item || item,

        name:
          data.name || "",

        price:
          data.price,

        action:
          data.action,

        previousLocation:
          data.previousLocation || "",

        newLocation:
          data.newLocation ||
          currentLocation,

        previousQuantity:
          previousQuantity,

        quantity:
          newQuantity
      };


      undoButton.disabled =
      false;


      totalScanCount++;

      uniqueItemSet.add(
        String(data.item || item)
      );


      if (
        data.action === "FIRST" ||
        data.action === "ADD"
      ) {

        unitsAddedCount++;
      }


      updateStats();


      showProductCard({

        item:
          data.item || item,

        name:
          data.name,

        price:
          data.price,

        location:
          data.newLocation ||
          currentLocation,

        quantity:
          newQuantity
      });


      // LOCATION CHANGED

      if (
        data.action === "MOVE" ||
        data.locationChanged === true
      ) {

        setStatus(

          "move",

          "⚠️ LOCATION CHANGED" +

          "<br><br>" +

          "ITEM #" +
          escapeHtml(
            data.item || item
          ) +

          "<br>" +

          escapeHtml(
            data.name || ""
          ) +

          "<br><br>" +

          "MOVED:" +

          "<br>" +

          "LOCATION " +
          escapeHtml(
            data.previousLocation
          ) +

          " → LOCATION " +
          escapeHtml(
            data.newLocation
          ) +

          "<br><br>" +

          "QUANTITY: " +
          newQuantity,

          true
        );


        addHistory(

          "↔ #" +
          (data.item || item) +

          " | " +
          data.previousLocation +

          " → " +
          data.newLocation +

          " | Qty " +
          newQuantity
        );


        playMoveTone();

      } else {

        setStatus(

          "success",

          "✓ ITEM #" +
          escapeHtml(
            data.item || item
          ) +

          "<br>" +

          escapeHtml(
            data.name || ""
          ) +

          "<br>" +

          "LOCATION " +
          escapeHtml(
            data.newLocation
          ) +

          "<br>" +

          "QUANTITY: " +
          newQuantity,

          true
        );


        addHistory(

          "+ #" +
          (data.item || item) +

          " | Location " +
          data.newLocation +

          " | Qty " +
          newQuantity
        );


        playSuccessTone();
      }


      manualItem.value =
      "";
    }
  );
}


// LOOKUP

function lookupItem(item) {

  if (!item) {

    showError("Enter Item #");
    return;
  }

  setStatus(
    "lookupStatus",
    "Looking up Item #" +
    item +
    "..."
  );

  jsonpRequest(

    "lookup",

    {
      item: item
    },

    function(data) {

      if (!data.success) {

        if (
          data.errorType ===
          "ITEM_NOT_FOUND"
        ) {

          showItemNotFound(item);

        } else {

          showError(
            data.message ||
            "Lookup failed"
          );
        }

        return;
      }


      showProductCard({

        item:
          data.item,

        name:
          data.name,

        price:
          data.price,

        location:
          data.location,

        quantity:
          data.quantity
      });


      setStatus(

        "lookupStatus",

        "🔍 ITEM #" +
        escapeHtml(data.item) +

        "<br>" +

        escapeHtml(
          data.name || ""
        ) +

        "<br>" +

        "LOCATION: " +
        escapeHtml(
          data.location ||
          "Not assigned"
        ) +

        "<br>" +

        "QUANTITY: " +
        Number(
          data.quantity || 0
        ),

        true
      );


      playLookupTone();
    }
  );
}


// SEARCH BY NAME

function searchProductName() {

  const query =
  String(
    nameSearch.value || ""
  ).trim();

  if (!query) {

    showError(
      "Enter product name"
    );

    return;
  }

  searchResults.style.display =
  "block";

  searchResults.innerHTML =
  "Searching...";


  jsonpRequest(

    "search",

    {
      query: query
    },

    function(data) {

      if (!data.success) {

        showError(
          data.message ||
          "Search failed"
        );

        return;
      }

      renderSearchResults(
        data.results || []
      );
    }
  );
}


// SEARCH RESULTS

function renderSearchResults(results) {

  searchResults.innerHTML =
  "";

  if (!results.length) {

    searchResults.innerHTML =
    "<strong>No products found</strong>";

    playErrorTone();

    return;
  }


  results.forEach(
    function(product) {

      const div =
      document.createElement(
        "div"
      );

      div.className =
      "searchResult";


      const name =
      document.createElement(
        "div"
      );

      name.className =
      "searchName";

      name.innerText =
      product.name ||
      "No name";


      const details =
      document.createElement(
        "div"
      );

      details.className =
      "searchDetails";

      details.innerText =

      "#" +
      product.item +

      " | Location: " +
      (
        product.location ||
        "—"
      ) +

      " | Qty: " +
      Number(
        product.quantity || 0
      );


      div.appendChild(name);
      div.appendChild(details);


      div.addEventListener(
        "click",
        function() {

          lookupItem(
            product.item
          );

          manualItem.value =
          product.item;
        }
      );


      searchResults.appendChild(
        div
      );
    }
  );
}


// PRODUCT CARD

function showProductCard(data) {

  productCard.style.display =
  "block";

  productName.innerText =
  data.name ||
  "No product name";

  productItem.innerText =
  data.item ||
  "—";


  if (
    data.price !== "" &&
    data.price !== null &&
    data.price !== undefined
  ) {

    const price =
    Number(data.price);

    if (!isNaN(price)) {

      productPrice.innerText =
      "$" +
      price.toFixed(2);

    } else {

      productPrice.innerText =
      data.price;
    }

  } else {

    productPrice.innerText =
    "—";
  }


  productLocation.innerText =
  data.location ||
  "Not assigned";


  productQuantity.innerText =
  Number(
    data.quantity || 0
  );
}


// UNDO

function undoLastItem() {

  if (!lastSuccessfulScan) {
    return;
  }

  const undoData =
  lastSuccessfulScan;

  undoButton.disabled =
  true;


  setStatus(
    "",
    "Undoing Item #" +
    undoData.item +
    "..."
  );


  jsonpRequest(

    "undo",

    {
      item:
        undoData.item,

      previousLocation:
        undoData.previousLocation,

      previousQuantity:
        undoData.previousQuantity
    },

    function(data) {

      if (!data.success) {

        showError(
          data.message ||
          "Undo failed"
        );

        undoButton.disabled =
        false;

        return;
      }


      if (totalScanCount > 0) {
        totalScanCount--;
      }


      if (
        undoData.action === "FIRST" ||
        undoData.action === "ADD"
      ) {

        if (unitsAddedCount > 0) {
          unitsAddedCount--;
        }
      }


      updateStats();


      showProductCard({

        item:
          undoData.item,

        name:
          undoData.name,

        price:
          undoData.price,

        location:
          data.restoredLocation,

        quantity:
          data.restoredQuantity
      });


      if (
        undoData.action === "MOVE"
      ) {

        setStatus(

          "undo",

          "↶ MOVE UNDONE" +

          "<br><br>" +

          "ITEM #" +
          escapeHtml(
            undoData.item
          ) +

          "<br>" +

          "LOCATION " +
          escapeHtml(
            undoData.newLocation
          ) +

          " → LOCATION " +
          escapeHtml(
            data.restoredLocation
          ) +

          "<br>" +

          "QUANTITY: " +
          Number(
            data.restoredQuantity || 0
          ),

          true
        );


        addHistory(

          "↶ #" +
          undoData.item +

          " | " +
          undoData.newLocation +

          " → " +
          (
            data.restoredLocation ||
            "blank"
          )
        );

      } else {

        setStatus(

          "undo",

          "↶ UNDO SUCCESSFUL" +

          "<br>" +

          "ITEM #" +
          escapeHtml(
            undoData.item
          ) +

          "<br>" +

          "LOCATION: " +
          escapeHtml(
            data.restoredLocation ||
            "BLANK"
          ) +

          "<br>" +

          "QUANTITY: " +
          Number(
            data.restoredQuantity || 0
          ),

          true
        );


        addHistory(

          "↶ #" +
          undoData.item +

          " | Qty " +
          Number(
            data.restoredQuantity || 0
          )
        );
      }


      recentScans.delete(
        "I:" +
        undoData.item
      );


      lastSuccessfulScan =
      null;

      playUndoTone();
    }
  );
}

// HISTORY

function addHistory(text) {

  const time =
  new Date()
    .toLocaleTimeString(
      [],
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  history.unshift(
    time +
    " — " +
    text
  );

  if (history.length > 10) {

    history =
    history.slice(
      0,
      10
    );
  }

  renderHistory();
}


function renderHistory() {

  historyList.innerHTML =
  "";

  if (!history.length) {

    historyList.innerText =
    "No activity yet";

    return;
  }

  history.forEach(
    function(text) {

      const div =
      document.createElement(
        "div"
      );

      div.className =
      "historyItem";

      div.innerText =
      text;

      historyList.appendChild(
        div
      );
    }
  );
}

  setStatus(
    "",
    "Scan Location QR first"

}


// JSONP
// Safari-safe version

function jsonpRequest(
  action,
  parameters,
  callback
) {

  const callbackName =
    "inventoryCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() *
      1000000
    );

  const script =
  document.createElement(
    "script"
  );

  let finished =
  false;

  let timeoutId =
  null;


  window[callbackName] =
  function(data) {

    if (finished) {
      return;
    }

    finished =
    true;


    if (timeoutId) {
      clearTimeout(
        timeoutId
      );
    }


    /*
      IMPORTANT:
      Process server response first.

      Do not delete the global JSONP
      callback before Safari has
      completed script execution.
    */

    try {

      callback(data);

    } finally {

      cleanup();
    }
  };


  let url =

  API_URL +

  "?action=" +

  encodeURIComponent(
    action
  );


  for (
    const key in parameters
  ) {

    if (
      Object.prototype
        .hasOwnProperty.call(
          parameters,
          key
        )
    ) {

      url +=

      "&" +

      encodeURIComponent(
        key
      ) +

      "=" +

      encodeURIComponent(
        parameters[key]
      );
    }
  }


  url +=

  "&callback=" +

  encodeURIComponent(
    callbackName
  ) +

  "&t=" +

  Date.now();


  script.async =
  true;

  script.src =
  url;


  script.onerror =
  function() {

    if (finished) {
      return;
    }

    finished =
    true;


    if (timeoutId) {

      clearTimeout(
        timeoutId
      );
    }


    cleanup();


    showError(
      "Could not reach server"
    );
  };


  /*
    HEAD is more reliable for
    dynamically loaded JSONP scripts
    in mobile Safari.
  */

  document.head.appendChild(
    script
  );


  timeoutId =
  setTimeout(

    function() {

      if (finished) {
        return;
      }

      finished =
      true;

      cleanup();

      showError(
        "Server timeout"
      );

    },

    30000
  );


  function cleanup() {

    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );
    }


    /*
      Safari:
      keep callback alive briefly
      after external script executes.
    */

    setTimeout(

      function() {

        try {

          delete window[
            callbackName
          ];

        } catch(e) {

          window[
            callbackName
          ] =
          undefined;
        }

      },

      1000
    );
  }
}


// HELPERS

function cleanItem(value) {

  return String(
    value || ""
  )
    .replace("#", "")
    .replace(/^I:/i, "")
    .trim();
}


function cleanRecentScans(now) {

  for (
    const [
      code,
      time
    ] of recentScans
  ) {

    if (
      now - time >
      SAME_QR_LOCK_TIME
    ) {

      recentScans.delete(
        code
      );
    }
  }
}


function setStatus(
  className,
  content,
  allowHtml
) {

  statusDisplay.className =
  className || "";

  if (allowHtml) {

    statusDisplay.innerHTML =
    content;

  } else {

    statusDisplay.innerText =
    content;
  }
}


function showError(message) {

  setStatus(
    "error",
    "ERROR: " +
    message
  );

  playErrorTone();
}


function escapeHtml(value) {

  return String(
    value == null
      ? ""
      : value
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );
}


// AUDIO

function unlockAudio() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!audioContext) {

      audioContext =
      new AudioContext();
    }

    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();
    }

    const oscillator =
      audioContext
        .createOscillator();

    const gain =
      audioContext
        .createGain();

    gain.gain.value =
    0.0001;

    oscillator.connect(
      gain
    );

    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime +
      0.05
    );

  } catch(e) {}
}


function playTone(
  frequency,
  duration,
  volume
) {

  try {

    if (!audioContext) {
      return;
    }

    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();
    }

    const oscillator =
      audioContext
        .createOscillator();

    const gain =
      audioContext
        .createGain();

    oscillator.connect(
      gain
    );

    gain.connect(
      audioContext.destination
    );

    oscillator.type =
    "sine";

    oscillator.frequency.value =
    frequency;

    gain.gain.setValueAtTime(

      volume || 0.35,

      audioContext.currentTime
    );

    gain.gain
      .exponentialRampToValueAtTime(

        0.01,

        audioContext.currentTime +
        duration / 1000
      );

    oscillator.start();

    oscillator.stop(

      audioContext.currentTime +
      duration / 1000
    );

  } catch(e) {}
}
